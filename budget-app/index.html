<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5f73d6" />
    <script>
      // 첫 화면 깜빡임 없이 저장된 테마 적용 (src/theme.ts 와 같은 키)
      try {
        var t = JSON.parse(localStorage.getItem('household-budget:theme') || 'null')
        if (t && (t.mode === 'light' || t.mode === 'dark')) document.documentElement.setAttribute('data-mode', t.mode)
        if (t && t.accent) document.documentElement.setAttribute('data-accent', t.accent)
        if (t && t.seasonal === false) document.documentElement.setAttribute('data-seasonal', 'off')
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="메덩파카 가계부" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>메덩파카 가계부</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
